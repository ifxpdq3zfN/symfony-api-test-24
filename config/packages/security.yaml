security:
    password_hashers:
        App\Entity\BrokerUser: 'auto'
        App\Entity\CustomerUser: 'auto'
    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        users:
            entity:
                class: App\Entity\BrokerUser
                property: username
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api:
            pattern: ^/foo
            stateless: true
            provider: users
            jwt: ~
        main:
            json_login:
                check_path: /authentication
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            stateless: true

    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/foo$, roles: PUBLIC_ACCESS }
        - { path: ^/foo/docs, roles: PUBLIC_ACCESS }
        - { path: ^/foo/contexts, roles: PUBLIC_ACCESS }
        - { path: ^/authentication, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }
